name: Deploy API to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'packages/core/**'
      - 'packages/sdk/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-api.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'packages/core/**'
      - 'packages/sdk/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

# Deployment goes to Cloudflare over its own API token; the GitHub token only
# needs to read the tree.
permissions:
  contents: read

# Cancel in-progress deployments for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.4'

jobs:
  lint-and-test:
    name: Lint & Test API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build workspace deps so @creepjs/core types resolve for lint/typecheck
      - name: Build workspace packages
        run: |
          pnpm --filter @creepjs/core build
          pnpm --filter @creepjs/sdk build

      - name: Lint API code
        run: pnpm --filter @creepjs/api lint

      - name: Type check
        run: pnpm --filter @creepjs/api typecheck

      - name: Run unit tests
        run: pnpm --filter @creepjs/api test
        env:
          NODE_ENV: test

      - name: Build API
        run: pnpm --filter @creepjs/api build

  deploy:
    name: Deploy to Cloudflare Workers
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only deploy on push to main or manual workflow dispatch
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    environment:
      name: production
      url: https://api.creepjs.org

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @creepjs/core build
          pnpm --filter @creepjs/sdk build
          pnpm --filter @creepjs/api build

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'apps/api'
          # Deploy the top-level `creepjs-api` worker. Do NOT use `--env production`:
          # wrangler.toml has no [env.production] block, so a named env would target a
          # separate `creepjs-api-production` worker that does NOT inherit the KV
          # bindings (TOKENS/RATE_LIMIT/IP_CACHE), [vars], or secrets.
          command: deploy

      - name: Wait for deployment to propagate
        run: sleep 10

      - name: Health check - API root
        id: health-check-root
        run: |
          echo "Testing API health endpoint..."
          # Retry to tolerate edge propagation / cold-connection blips after deploy.
          status="000"
          for i in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://api.creepjs.org/ || echo "000")
            echo "Attempt $i: $status"
            [ "$status" = "200" ] && break
            sleep 6
          done

          if [ "$status" = "200" ]; then
            echo "✅ Health check passed!"
            echo "status=success" >> $GITHUB_OUTPUT
          else
            # Non-fatal: the deploy step is authoritative. Cloudflare edge security
            # (Bot Fight / WAF) may 403 the runner's datacenter IP even though the
            # Worker deployed fine. Warn instead of failing + rolling back a good deploy.
            echo "::warning::Post-deploy edge probe returned $status (likely Cloudflare bot/WAF on the runner IP), not failing the deploy."
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: Health check - Fingerprint endpoint
        if: steps.health-check-root.outputs.status == 'success'
        run: |
          echo "Testing fingerprint endpoint..."
          response_file="$RUNNER_TEMP/fingerprint-smoke.json"
          # workers.dev, as in the batch check below: the custom domain's WAF
          # answers GitHub-hosted runners with 403. The body is the fixture an
          # API test posts, so a schema change cannot silently break this.
          status_code=$(curl -sS --max-time 20 \
            -o "$response_file" \
            -w "%{http_code}" \
            https://creepjs-api.difft.workers.dev/v1/fingerprint \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-API-Token: ${{ secrets.TEST_API_TOKEN }}" \
            --data-binary @apps/api/tests/fixtures/deploy-smoke-fingerprint.json)

          echo "Response code: $status_code"
          if [ "$status_code" != "200" ]; then
            echo "::error::Fingerprint endpoint smoke returned $status_code"
            cat "$response_file"
            exit 1
          fi

          node - "$response_file" <<'NODE'
          const fs = require('node:fs');
          const response = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          // The server derives the ID; it must not echo the submitted one.
          if (
            typeof response.fingerprintId !== 'string' ||
            response.fingerprintId.length === 0 ||
            response.fingerprintId === 'deploy-smoke'
          ) {
            console.error('::error::Fingerprint endpoint response is invalid');
            process.exit(1);
          }
          console.log('✅ Fingerprint endpoint check passed!');
          NODE

      - name: Health check - Partner event contract
        if: steps.health-check-root.outputs.status == 'success'
        run: |
          response_file="$RUNNER_TEMP/partner-event-smoke.txt"
          status_code=$(curl -sS --max-time 20 \
            -o "$response_file" -w "%{http_code}" \
            https://creepjs-api.difft.workers.dev/v1/events \
            -X POST -H "Origin: https://creepjs.org" \
            -H "Content-Type: text/plain" \
            -d '{"name":"partner_impression","path":"/proxy-providers","props":{"label":"release-validation","section":"partner-directory"}}')
          if [ "$status_code" != "204" ] || [ -s "$response_file" ]; then
            echo "::error::Partner event contract returned $status_code; expected an empty 204"
            exit 1
          fi
          echo "Partner event accepted; this is not a storage-persistence check."

      - name: Health check - Batch endpoint contract
        if: steps.health-check-root.outputs.status == 'success'
        run: |
          echo "Testing authenticated batch contract without an upstream IP lookup..."
          response_file="$RUNNER_TEMP/batch-smoke.json"
          # The custom domain may WAF-block GitHub-hosted runners. This origin
          # targets the exact deployed Worker version without that edge policy.
          status_code=$(curl -sS --max-time 20 \
            -o "$response_file" \
            -w "%{http_code}" \
            https://creepjs-api.difft.workers.dev/v1/ip/batch \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-API-Token: ${{ secrets.TEST_API_TOKEN }}" \
            -d '{"ips":["not-an-ip"]}')

          echo "Response code: $status_code"
          if [ "$status_code" != "200" ]; then
            echo "::error::Batch endpoint smoke returned $status_code"
            exit 1
          fi

          node - "$response_file" <<'NODE'
          const fs = require('node:fs');
          const response = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const valid =
            response.submittedCount === 1 &&
            response.validCount === 0 &&
            response.invalidCount === 1 &&
            response.quotaCost === 1 &&
            response.results?.length === 1 &&
            response.results[0]?.outcome === 'invalid' &&
            response.results[0]?.status === 400;

          if (!valid) {
            console.error('::error::Batch endpoint response contract mismatch');
            process.exit(1);
          }

          console.log('✅ Batch endpoint contract check passed!');
          NODE

      # Only roll back a version this run actually shipped. If install, build
      # or the deploy itself failed, the live version is still the good one,
      # and `wrangler rollback` would replace it with the release before it.
      - name: Rollback on failure
        if: failure() && steps.deploy.outcome == 'success'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'apps/api'
          command: rollback

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment failed and was rolled back. Check logs for details."

      - name: Report deployment success
        if: success()
        run: |
          echo "::notice::✅ API deployed successfully to https://api.creepjs.org"
